<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>剧集生产状态</title><script>Object.defineProperty(window,'d',{configurable:true,get(){return typeof doc==='undefined'?undefined:doc}});</script><style>
:root{--bg:#f4f5f2;--surface:#fff;--surface2:#eef0ec;--ink:#202521;--muted:#6e776e;--line:#d9ded7;--accent:#3d6b55;--ok:#2e7650;--warn:#a06a16;--danger:#bd4038;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}[data-theme=dark]{--bg:#111512;--surface:#181d19;--surface2:#222a24;--ink:#eef2ed;--muted:#a0aaa1;--line:#303a32;--accent:#8db99e;--ok:#79c296;--warn:#e0ad61;--danger:#f47e73}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;color:inherit;cursor:pointer}svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.mono{font-family:var(--mono)}.top{position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px)}.topin{max-width:1320px;margin:auto;padding:17px 28px;display:flex;justify-content:space-between;align-items:center;gap:18px}.back,.tool{height:35px;border:1px solid var(--line);background:var(--surface);border-radius:5px;display:inline-flex;align-items:center;gap:7px;padding:0 11px}.back{margin-right:10px}.tool:hover,.back:hover{border-color:var(--accent)}.tools{display:flex;gap:8px}.page{max-width:1320px;margin:auto;padding:30px 28px 70px}.eyebrow{color:var(--muted);font:11px var(--mono);text-transform:uppercase;letter-spacing:.06em}.headline{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:26px}.headline h1{margin:6px 0 0;font-size:30px;line-height:1.2}.headline p{margin:8px 0 0;color:var(--muted)}.headline-side{text-align:right}.state{font-weight:600}.state.ok{color:var(--ok)}.state.warn{color:var(--warn)}.state.danger{color:var(--danger)}.headline-side small{display:block;color:var(--muted);margin-top:5px}.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);gap:22px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px}.panel-head{padding:16px 18px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:15px}.panel-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.timeline{padding:13px 18px 17px}.stage{display:grid;grid-template-columns:34px minmax(0,1fr) 94px;gap:11px;align-items:start;min-height:57px;position:relative}.stage:not(:last-child)::after{content:"";position:absolute;left:16px;top:31px;bottom:0;width:1px;background:var(--line)}.stage-mark{position:relative;z-index:1;width:33px;height:33px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--surface);font:11px var(--mono);color:var(--muted)}.stage.done .stage-mark{border-color:var(--ok);color:var(--ok)}.stage.current .stage-mark{border:2px solid var(--accent);color:var(--accent)}.stage.failed .stage-mark{border-color:var(--danger);color:var(--danger)}.stage-copy strong{display:block;margin-top:2px}.stage-copy small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.stage-status{text-align:right;font-size:11px;color:var(--muted)}.stage-status.ok{color:var(--ok)}.stage-status.warn{color:var(--warn)}.stage-status.danger{color:var(--danger)}.scan{padding:16px 18px}.scan-action{display:flex;justify-content:space-between;align-items:center;gap:12px}.scan-action strong{font-size:14px}.scan-action p{margin:3px 0 0;color:var(--muted);font-size:12px}.scan-btn{height:36px;padding:0 12px;border:0;border-radius:5px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}.scan-btn:disabled{opacity:.5}.scan-btn.loading svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.scan-meta{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.scan-meta div{padding:10px;background:var(--surface2);border-radius:4px}.scan-meta b{display:block;font:16px var(--mono)}.scan-meta span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.checks{margin-top:14px;border-top:1px solid var(--line)}.check{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.check:last-child{border-bottom:0}.check small{color:var(--muted);text-align:right;max-width:220px}.check.ok small{color:var(--ok)}.check.fail small{color:var(--danger)}.check.warn small{color:var(--warn)}.facts{padding:13px 18px}.fact{display:grid;grid-template-columns:105px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.fact:last-child{border:0}.fact dt{color:var(--muted);font-size:12px}.fact dd{margin:0;min-width:0;overflow-wrap:anywhere}.evidence{margin-top:14px;padding:13px;border-left:3px solid var(--danger);background:color-mix(in srgb,var(--danger) 8%,var(--surface));font-size:12px}.evidence strong{color:var(--danger)}.evidence ul{margin:7px 0 0;padding-left:18px}.legacy{display:inline-flex;margin-left:8px;padding:2px 6px;border:1px solid var(--accent);border-radius:3px;color:var(--accent);font:10px var(--mono)}.hint{margin-top:16px;color:var(--muted);font-size:11px}.offline{padding:40px;text-align:center;color:var(--danger)}@media(max-width:860px){.topin,.page{padding-left:16px;padding-right:16px}.layout{grid-template-columns:1fr}.headline{display:block}.headline-side{text-align:left;margin-top:14px}}@media(max-width:560px){.stage{grid-template-columns:34px minmax(0,1fr)}.stage-status{grid-column:2;text-align:left;margin-top:-9px;margin-bottom:10px}.scan-action{align-items:flex-start;flex-direction:column}.scan-meta{grid-template-columns:1fr 1fr}.headline h1{font-size:25px}}
</style></head>
<body><header class="top"><div class="topin"><div><button class="back" onclick="location.href='dashboard.html'"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>总览</button><span id="crumb" class="eyebrow">EP --</span></div><div class="tools"><button id="refresh" class="tool" title="刷新"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0 2 5.5"/><path d="M20 4v7h-7"/></svg></button><button id="theme" class="tool" title="切换主题"><svg viewBox="0 0 24 24"><path d="M20.5 15.2A8.5 8.5 0 1 1 8.8 3.5 6.5 6.5 0 0 0 20.5 15.2Z"/></svg></button></div></div></header><main id="root" class="page"><div class="offline">正在读取本地服务…</div></main><script src="status-store.js"></script><script>
const $=s=>document.querySelector(s),id=new URLSearchParams(location.search).get('episode')||'episode-01';let doc,scanning=false;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stateMeta={complete:['完成','ok'],'in-progress':['进行中','ok'],'awaiting-approval':['人工门禁','warn'],blocked:['机器失败','danger'],'not-started':['未开始','warn'],'not-required':['豁免','ok']};
function scanMeta(d){if(!d.automation?.ranAt)return['待扫描','warn'];return d.automation.status==='failed'?['机器失败','danger']:['扫描通过','ok']}function render(){const current=d.stages?.find(s=>s.id===d.summary?.currentStage),[scan,scanTone]=scanMeta(d),legacy=d.workflow?.mode==='legacy',checks=Object.entries(d.automation?.checks||{}),failed=d.automation?.failures||[],warnings=d.automation?.warnings||[],done=(d.stages||[]).filter(s=>['complete','not-required'].includes(s.status)).length,total=d.stages?.length||14;document.title=`${d.episodeId} · ${d.title}`;$('#crumb').textContent=`EP ${d.episodeId.match(/\d+/)?.[0]||'--'}`;$('#root').innerHTML=`<div class="headline"><div><span class="eyebrow">${esc(d.episodeId)}${legacy?'<span class="legacy">旧流程豁免</span>':''}</span><h1>${esc(d.title)}</h1><p>当前阶段：<strong>${esc(current?.name||d.summary?.currentStage||'未识别')}</strong> · ${esc(d.summary?.nextAction||'暂无下一步')}</p></div><div class="headline-side"><div class="state ${scanTone}">${scan}</div><small>更新于 ${esc(d.updatedAt||'未知')} · 阶段 ${done}/${total}</small></div></div><div class="layout"><section><div class="panel"><div class="panel-head"><h2>生产阶段</h2><p>阶段状态由文件观测和机械扫描自动推导；人工门禁只作为外部流程边界显示。</p></div><div class="timeline">${(d.stages||[]).map((s,i)=>{const m=stateMeta[s.status]||['未知','warn'],isCurrent=s.id===d.summary?.currentStage;return `<div class="stage ${s.status==='complete'||s.status==='not-required'?'done ':''}${isCurrent?'current ':''}${s.health==='blocked'?'failed':''}"><div class="stage-mark">${String(i+1).padStart(2,'0')}</div><div class="stage-copy"><strong>${esc(s.name)}</strong><small>${isCurrent?esc(d.summary?.nextAction||'当前阶段'):(s.status==='not-required'?'旧流程豁免':m[0])}</small></div><div class="stage-status ${s.health==='blocked'?'danger':m[1]}">${s.health==='blocked'?'失败':m[0]}</div></div>`}).join('')}</div></div><div class="panel" style="margin-top:18px"><div class="panel-head"><h2>机器检查明细</h2><p>只展示自动化扫描结论，不在此页面进行审批或人员分配。</p></div><div class="scan"><div class="scan-action"><div><strong>手动触发本集扫描</strong><p>扫描完成后自动刷新当前阶段与失败证据。</p></div><button id="scanBtn" class="scan-btn"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M4 4l3 3M17 17l3 3M3 12h4M17 12h4M4 20l3-3M17 7l3-3"/><circle cx="12" cy="12" r="3"/></svg><span>扫描本集</span></button></div><div class="scan-meta"><div><b>${checks.length}</b><span>检查项</span></div><div><b class="${failed.length?'state danger':'state ok'}">${failed.length}</b><span>失败</span></div><div><b class="${warnings.length?'state warn':'state ok'}">${warnings.length}</b><span>警告</span></div></div><div class="checks">${checks.length?checks.map(([k,v])=>`<div class="check ${v.status==='passed'?'ok':v.status==='failed'?'fail':'warn'}"><span>${esc(k)}</span><small>${esc(v.detail||v.status)}</small></div>`).join(''):'<div class="hint">尚未执行扫描。</div>'}</div>${failed.length?`<div class="evidence"><strong>需要处理的机器失败</strong><ul>${failed.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}${warnings.length?`<div class="hint">警告：${warnings.map(esc).join('；')}</div>`:''}</div></div></section><aside><div class="panel"><div class="panel-head"><h2>当前事实</h2><p>用于判断是否需要回到 Agent 工作流处理。</p></div><dl class="facts"><div class="fact"><dt>自动化状态</dt><dd class="state ${scanTone}">${scan}</dd></div><div class="fact"><dt>当前阶段</dt><dd>${esc(current?.name||d.summary?.currentStage||'未识别')}</dd></div><div class="fact"><dt>生产状态</dt><dd>${esc(d.readiness?.productionStatus||d.summary?.productionStatus||'—')}</dd></div><div class="fact"><dt>音频</dt><dd>${esc(d.observations?.audio?.status||'未观测')} · 缺失 ${d.observations?.audio?.missingCount||0}</dd></div><div class="fact"><dt>播放器</dt><dd>${esc(d.observations?.player?.status||'未观测')} · 章节 ${d.observations?.player?.chaptersCompleted||0}/${d.observations?.player?.chaptersTotal||0}</dd></div></dl></div><p class="hint">本页面不修改状态文件，不记录审批、不分配负责人、不排序剧集。需要人工判断时，请在 Agent 工作流中完成并由对应流程写回事实源。</p></aside></div>`;$('#scanBtn').onclick=scanEpisode}
async function load(){try{const r=await window.CourseStatusStore.loadHttpEpisode(id);doc=r.doc;render()}catch(e){$('#root').innerHTML=`<div class="offline">无法连接本地服务。请运行“启动生产状态工作台.cmd”。<br><small>${esc(e.message||e)}</small></div>`}}
async function wait(run){for(;;){await new Promise(r=>setTimeout(r,500));const r=await fetch(`/api/production-status/scan?run=${encodeURIComponent(run)}`,{cache:'no-store'}),p=await r.json();if(p.status!=='running')return p}}
async function scanEpisode(){if(scanning)return;scanning=true;const b=$('#scanBtn'),s=b.querySelector('span');b.disabled=true;b.classList.add('loading');s.textContent='扫描中…';try{const r=await fetch('/api/production-status/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({episode:id})}),p=await r.json();if(!r.ok&&r.status!==409)throw Error(p.error||`HTTP ${r.status}`);const result=await wait(p.id);if(result.status!=='passed')throw Error(result.error||result.output||'扫描失败');await load()}catch(e){alert(`扫描失败：${e.message||e}`)}finally{scanning=false}}
$('#refresh').onclick=load;$('#theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('coursewebvideo-theme',t)};document.documentElement.dataset.theme=localStorage.getItem('coursewebvideo-theme')||'light';load();
</script></body></html>

<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课程视频生产进度</title>
  <style>
    :root{--bg:#f4f5f2;--surface:#fff;--surface-2:#eef0ec;--ink:#202521;--muted:#6e776e;--line:#d9ded7;--accent:#3d6b55;--accent-soft:#e5eee8;--ok:#2e7650;--warn:#a06a16;--danger:#bd4038;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
    [data-theme=dark]{--bg:#111512;--surface:#181d19;--surface-2:#222a24;--ink:#eef2ed;--muted:#a0aaa1;--line:#303a32;--accent:#8db99e;--accent-soft:#22372b;--ok:#79c296;--warn:#e0ad61;--danger:#f47e73}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif} button{font:inherit;color:inherit;cursor:pointer} a{color:inherit;text-decoration:none} svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.mono{font-family:var(--mono)}
    .topbar{position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px)}.topbar-inner{max-width:1480px;margin:auto;padding:18px 30px;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{display:flex;align-items:center;gap:14px}.brand-mark{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--accent);color:var(--accent);border-radius:7px}.brand h1{margin:0;font-size:18px;letter-spacing:.01em}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;align-items:center}.btn{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);display:inline-flex;align-items:center;gap:8px}.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.icon{width:36px;padding:0;justify-content:center}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.is-loading svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .page{max-width:1480px;margin:auto;padding:30px}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.intro h2{margin:0;font-size:30px;letter-spacing:-.02em}.intro p{margin:7px 0 0;color:var(--muted)}.connection{font:12px var(--mono);color:var(--muted);white-space:nowrap}.connection.ok{color:var(--ok)}.connection.fail{color:var(--danger)}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}.metric{padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:6px}.metric-label{color:var(--muted);font-size:12px}.metric-value{display:block;margin-top:8px;font:600 30px/1 var(--mono)}.metric-note{display:block;margin-top:9px;color:var(--muted);font-size:11px}
    .scan-band{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:15px 17px;margin-bottom:26px;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);border-radius:4px}.scan-band strong{display:block}.scan-band span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.scan-meta{text-align:right;color:var(--muted);font:11px var(--mono)}
    .section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:12px}.section-head h3{margin:0;font-size:15px}.section-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.legend{display:flex;gap:13px;color:var(--muted);font-size:11px}.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:currentColor}.legend .ok{color:var(--ok)}.legend .warn{color:var(--warn)}.legend .danger{color:var(--danger)}
    .episode-list{border-top:1px solid var(--line)}.episode-row{display:grid;grid-template-columns:72px minmax(180px,1.5fr) minmax(190px,1fr) minmax(200px,1.2fr) 130px 32px;gap:18px;align-items:center;padding:14px 10px;border-bottom:1px solid var(--line);transition:background .15s}.episode-row:hover{background:var(--surface)}.episode-no{font:600 14px var(--mono);color:var(--muted)}.episode-title{min-width:0}.episode-title strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.episode-title small{display:block;color:var(--muted);margin-top:3px}.stage{min-width:0}.stage-label{font-weight:600}.stage-note{display:block;margin-top:3px;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar{height:5px;margin-top:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.scan-state{font-size:12px}.scan-state.ok{color:var(--ok)}.scan-state.warn{color:var(--warn)}.scan-state.danger{color:var(--danger)}.row-link{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;color:var(--muted)}.row-link:hover{border-color:var(--accent);color:var(--accent)}.empty{padding:42px;text-align:center;color:var(--muted);border:1px dashed var(--line)}
    @media(max-width:900px){.topbar-inner,.page{padding-left:16px;padding-right:16px}.metrics{grid-template-columns:repeat(2,1fr)}.episode-row{grid-template-columns:52px minmax(150px,1fr) minmax(170px,1fr) 100px 32px;gap:10px}.scan-state{display:none}}
    @media(max-width:620px){.topbar-inner{align-items:flex-start}.brand p{display:none}.actions .label{display:none}.intro{display:block}.connection{margin-top:12px}.metrics{gap:8px}.metric{padding:13px}.metric-value{font-size:24px}.scan-band{align-items:flex-start}.scan-meta{display:none}.episode-list{margin:0 -6px}.episode-row{grid-template-columns:42px minmax(0,1fr) 30px;padding:13px 6px}.episode-row>.stage,.episode-row>.scan-state{grid-column:2}.episode-row>.row-link{grid-column:3;grid-row:1 / span 2}.episode-title strong{white-space:normal}.legend{display:none}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 18V6M4 18h16M8 15l3-4 3 2 4-6"/></svg></div><div><h1>课程视频生产进度</h1><p>当前阶段 · 机械扫描 · 阻塞证据</p></div></div><div class="actions"><span id="connection" class="connection">正在连接本地服务</span><button id="refresh" class="btn icon" title="刷新"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0 2 5.5"/><path d="M20 4v7h-7"/></svg></button><button id="scan" class="btn primary"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M4 4l3 3M17 17l3 3M3 12h4M17 12h4M4 20l3-3M17 7l3-3"/><circle cx="12" cy="12" r="3"/></svg><span class="label">扫描全部</span></button><button id="theme" class="btn icon" title="切换主题"><svg viewBox="0 0 24 24"><path d="M20.5 15.2A8.5 8.5 0 1 1 8.8 3.5 6.5 6.5 0 0 0 20.5 15.2Z"/></svg></button></div></div></header>
  <main class="page"><div class="intro"><div><h2>生产总览</h2><p>按剧集编号跟踪生产序列；只有机械扫描失败才会形成技术阻塞。</p></div><span id="lastScan" class="connection">尚未扫描</span></div><section id="metrics" class="metrics" aria-label="生产指标"></section><section class="scan-band"><div><strong>自动化扫描</strong><span>任务包、A-page、Visual rough、Player 合约、音频完整性，以及可选的 typecheck / lint。</span></div><div id="scanMeta" class="scan-meta">可手动触发 · 结果写回状态文件</div></section><div class="section-head"><div><h3>剧集序列</h3><p>当前阶段由状态扫描自动推导，旧流程集会显示豁免标记。</p></div><div class="legend"><span class="ok"><i></i>扫描通过</span><span class="warn"><i></i>待扫描</span><span class="danger"><i></i>机器失败</span></div></div><section id="episodes" class="episode-list" aria-live="polite"></section></main>
  <script src="status-store.js"></script><script>
    const $=s=>document.querySelector(s);let docs=[],scanning=false;
    const meta={delivered:['已交付','ok'],complete:['已完成','ok'],ready:['可推进','ok'],'in-progress':['制作中','ok'],'needs-owner':['需处理','warn'],'needs-scan':['待扫描','warn'],'not-started':['未开始','warn'],blocked:['机器失败','danger']};
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const epNum=id=>String(id).match(/\d+/)?.[0]||'??';
    function stageProgress(d){const a=d.stages||[],done=a.filter(s=>['complete','not-required'].includes(s.status)).length;return [done,a.length||14]}
    function readiness(d){return d.readiness?.state||d.summary?.status||'not-started'}
    function scanState(d){if(!d.automation?.ranAt)return ['待扫描','warn'];return d.automation.status==='failed'?['机器失败','danger']:['扫描通过','ok']}
    function render(){
      const counts={};docs.forEach(x=>counts[readiness(x.doc)]=(counts[readiness(x.doc)]||0)+1);const blocked=counts.blocked||0,scanned=docs.filter(x=>x.doc.automation?.ranAt).length,failures=docs.reduce((n,x)=>n+(x.doc.automation?.failures?.length||0),0);
      $('#metrics').innerHTML=[['剧集总数',docs.length,'按编号持续跟踪'],['当前制作中',counts['in-progress']||0,'已有正式输入或播放器入口'],['机器失败',blocked,failures?`${failures} 条失败证据`:'暂无失败证据'],['扫描覆盖',`${scanned}/${docs.length}`,scanned===docs.length?'全部已扫描':'需要手动触发扫描']].map(([l,v,n])=>`<div class="metric"><span class="metric-label">${l}</span><strong class="metric-value">${v}</strong><span class="metric-note">${n}</span></div>`).join('');
      $('#episodes').innerHTML=docs.length?docs.map(({doc:d})=>{const [done,total]=stageProgress(d),pct=Math.round(done/total*100),[scan,scanTone]=scanState(d),legacy=d.workflow?.mode==='legacy',state=readiness(d),status=meta[state]||['未知','warn'];const reason=d.automation?.failures?.[0]||d.summary?.blockers?.[0]||d.summary?.nextAction||'等待进入生产';return `<article class="episode-row"><div class="episode-no">EP${epNum(d.episodeId)}</div><div class="episode-title"><strong>${esc(d.title)}</strong><small>${esc(status[0])}${legacy?' · 旧流程豁免':''}</small></div><div class="stage"><span class="stage-label">${esc(d.stages?.find(s=>s.id===d.summary?.currentStage)?.name||d.summary?.currentStage||'未识别阶段')}</span><span class="stage-note">${esc(reason)}</span><div class="bar"><i style="width:${pct}%"></i></div></div><div class="scan-state ${scanTone}">${scan}<br><small>${d.automation?.ranAt?esc(new Date(d.automation.ranAt).toLocaleString('zh-CN',{hour12:false})):'需要扫描'}</small></div><a class="row-link" href="episode-workbench.html?episode=${encodeURIComponent(d.episodeId)}" title="查看本集"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></a></article>`}).join(''):'<div class="empty">无法读取状态索引。请通过“启动生产状态工作台.cmd”打开本地服务。</div>';
      const latest=docs.map(x=>x.doc.automation?.ranAt||'').filter(Boolean).sort().at(-1);$('#lastScan').textContent=latest?`最近扫描：${new Date(latest).toLocaleString('zh-CN',{hour12:false})}`:'尚未扫描';
    }
    async function load(){try{const p=await window.CourseStatusStore.loadHttpIndex(Date.now());docs=p.episodes.map(doc=>({doc}));$('#connection').textContent='本地服务已连接';$('#connection').className='connection ok';render()}catch(e){docs=[];$('#connection').textContent='本地服务未连接';$('#connection').className='connection fail';render()}}
    async function wait(id){for(;;){await new Promise(r=>setTimeout(r,500));const r=await fetch(`/api/production-status/scan?run=${encodeURIComponent(id)}`,{cache:'no-store'});const p=await r.json();if(p.status!=='running')return p}}
    async function scanAll(){if(scanning)return;scanning=true;const b=$('#scan'),label=b.querySelector('span');b.disabled=true;b.classList.add('is-loading');label.textContent='扫描中…';try{const r=await fetch('/api/production-status/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),p=await r.json();if(!r.ok&&r.status!==409)throw Error(p.error||`HTTP ${r.status}`);const done=await wait(p.id);if(done.status!=='passed')throw Error(done.error||done.output||'扫描失败');await load()}catch(e){alert(`扫描失败：${e.message||e}`)}finally{scanning=false;b.disabled=false;b.classList.remove('is-loading');label.textContent='扫描全部'}}
    $('#scan').onclick=scanAll;$('#refresh').onclick=load;$('#theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('coursewebvideo-theme',t)};document.documentElement.dataset.theme=localStorage.getItem('coursewebvideo-theme')||'light';load();
  </script>
</body></html>
